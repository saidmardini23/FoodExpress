<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/comunes :: head('Lista de Pedidos')}"></head>
<body>

    <div class="container">
        <!-- Menú superior con indicación de pestaña activa -->
        <div th:replace="~{fragmentos/comunes :: menu('lista')}"></div>

        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 style="margin: 0;">Gestión de Domicilios</h2>
                <a th:href="@{/pedidos/nuevo}" class="btn btn-blue">+ Registrar Pedido</a>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Cliente</th>
                        <th>Plato</th>
                        <th>Precio</th>
                        <th>Estado</th>
                        <th style="text-align: right;">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="pedido : ${pedidos}">
                        <td th:text="${pedido.id}">1</td>
                        <td th:text="${pedido.cliente}" style="font-weight: 600;">Mario</td>
                        <td th:text="${pedido.plato}">Pizza Pepperoni</td>
                        <td th:text="${'$' + #numbers.formatDecimal(pedido.precio, 1, 2)}">$12.50</td>
                        <td>
                            <span th:if="${pedido.entregado}" class="badge badge-entregado">✓ Entregado</span>
                            <span th:unless="${pedido.entregado}" class="badge badge-pendiente">⏳ Pendiente</span>
                        </td>
                        <td style="text-align: right; display: flex; gap: 6px; justify-content: flex-end;">
                            <!-- Botón Marcar como Entregado (solo si está pendiente) -->
                            <form th:unless="${pedido.entregado}" 
                                  th:action="@{/pedidos/{id}/entregar(id=${pedido.id})}" 
                                  method="post" 
                                  style="display:inline;">
                                <button type="submit" class="btn btn-green" title="Marcar como entregado">Entregar</button>
                            </form>

                            <!-- Botón Editar -->
                            <a th:href="@{/pedidos/{id}/editar(id=${pedido.id})}" class="btn btn-blue">Editar</a>
                            
                            <!-- Botón Eliminar -->
                            <form th:action="@{/pedidos/{id}/eliminar(id=${pedido.id})}" 
                                  method="post" 
                                  style="display:inline;">
                                <button type="submit" 
                                        class="btn btn-pink" 
                                        onclick="return confirm('¿Está seguro de eliminar este pedido?')">Eliminar</button>
                            </form>
                        </td>
                    </tr>
                    <!-- Fila para tabla vacía -->
                    <tr th:if="${#lists.isEmpty(pedidos)}">
                        <td colspan="6" style="text-align: center; color: var(--text-muted); padding: 30px;">
                            No hay pedidos registrados en el sistema actualmente.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>

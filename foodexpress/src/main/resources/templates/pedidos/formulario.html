<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/comunes :: head('Gestionar Pedido')}"></head>
<body>

    <div class="container">
        <div th:replace="~{fragmentos/comunes :: menu(${esEdicion != null && esEdicion} ? '' : 'nuevo')}"></div>

        <div class="card" style="max-width: 550px; margin: 0 auto;">
            <h3 style="margin-top: 0; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 12px;" 
                th:text="${esEdicion != null && esEdicion} ? 'Editar Pedido #' + ${idPedido} : 'Nuevo Pedido'">Detalles del Pedido</h3>

            <form th:action="${esEdicion != null && esEdicion} ? @{/pedidos/{id}(id=${idPedido})} : @{/pedidos}" 
                  th:object="${nuevoPedido}" 
                  method="post">

                <div class="form-group">
                    <label for="cliente">Nombre del Cliente *</label>
                    <input type="text" id="cliente" th:field="*{cliente}" class="form-control" placeholder="Ej. Jesus Franco">
                    <div class="error-msg" th:if="${#fields.hasErrors('cliente')}" th:errors="*{cliente}"></div>
                </div>

                <div class="form-group">
                    <label for="plato">Plato Solicitado *</label>
                    <input type="text" id="plato" th:field="*{plato}" class="form-control" placeholder="Ej. Hamburguesa Doble Carne">
                    <div class="error-msg" th:if="${#fields.hasErrors('plato')}" th:errors="*{plato}"></div>
                </div>

                <div class="form-group">
                    <label for="precio">Precio *</label>
                    <input type="number" id="precio" step="0.01" th:field="*{precio}" class="form-control" placeholder="0.00">
                    <div class="error-msg" th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}"></div>
                </div>

                <div style="display: flex; gap: 12px; margin-top: 25px;">
                    <button type="submit" class="btn btn-blue" style="flex: 1;">Guardar Pedido</button>
                    <a th:href="@{/pedidos}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
